name: Validación única 2023-2024 (Estrategia A v0)

# Corre UNA sola vez la validación aprobada en Leer.txt. El script comprueba que el motor sea el congelado
# (commit f7b907e), no descarga datos de 2025 en adelante y se niega a correr si ya hay resultados.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validacion.yml"

permissions:
  contents: write

concurrency:
  group: validacion
  cancel-in-progress: false

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas del motor congelado (datos sintéticos)
        run: |
          mkdir -p logs
          set -o pipefail
          python -m pytest -v 2>&1 | tee logs/validacion_tests.log

      - name: Validación única
        run: python -m backtest.correr_validacion

      - name: Guardar resultados y logs en el repo
        if: always()
        run: |
          {
            echo "GitHub Actions run ${GITHUB_RUN_ID} | commit ${GITHUB_SHA::7} | $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Pasos: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > logs/validacion_ultima_corrida.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in resultados logs registro_experimentos.txt; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then echo "Nada para guardar"; exit 0; fi
          git commit -m "Resultados y logs de la validación única (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
